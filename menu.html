
<!DOCTYPE html>
<html>
<head>
    <title>Menu - ACEW Smart Canteen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1> Our Delicious Menu</h1>

    <div class="menu-container">

        <div class="item">
            <img src="https://images.unsplash.com/photo-1604908176997-125f25cc6f3d" alt="Meals">
            <h2>South Indian Meals</h2>
            <p>₹80</p>
            <input type="number" min="1" value="1" id="qty1">
            <button onclick="addToCart('Meals', 80, 'qty1')">Add to Cart</button>
        </div>

        <div class="item">
            <img src="https://images.unsplash.com/photo-1553909489-cd47e0907980" alt="Sandwich">
            <h2>Veg Sandwich</h2>
            <p>₹40</p>
            <input type="number" min="1" value="1" id="qty2">
            <button onclick="addToCart('Sandwich', 40, 'qty2')">Add to Cart</button>
        </div>
        <div class="item">
           <img src="https://tse1.mm.bing.net/th/id/OIP.jJI3bTJ-diLfKDHb9-vwmwHaE8?w=6328&h=4219&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Noodles">
           <h2>Noodles</h2>
           <p>₹100</p>
           <input type="number" min="1" value="1" id="qty3">
           <button onclick="addToCart('Noodles', 100, 'qty3')">Add to Cart</button>
        </div>
        <div class="item">
            <img src="https://images.unsplash.com/photo-1576107232684-1279f390859f" alt="Fries">
            <h2>French Fries</h2>
            <p>₹50</p>
            <input type="number" min="1" value="1" id="qty4">
            <button onclick="addToCart('Fries', 50, 'qty4')">Add to Cart</button>
        </div>
        <div class="item">
            <img src="https://www.garnishandglaze.com/wp-content/uploads/2019/07/summer-fruit-salad-8.jpg" alt="Salad">
            <h2>Fruit Salad</h2>
            <p>₹60</p>
            <input type="number" min="1" value="1" id="qty5">
            <button onclick="addToCart('Salad', 60, 'qty5')">Add to Cart</button>
        </div>

    </div>

    <h2>Cart</h2>
    <div id="cart"></div>
    <h3 id="total">Total: ₹0</h3>

    <script src="script.js"></script>
</body>
</html>
